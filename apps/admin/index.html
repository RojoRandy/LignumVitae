<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <!-- El logo de marca es una insignia circular con texto integrado ("LIGNUM
         VITAE / MI PEQUENO PARAISO"): no cabe legible en la barra del sidebar
         (64px de alto), pero es exactamente lo que necesita un favicon.
         Antes esto apuntaba a un /favicon.png que no existia (404). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal administrativo privado de Lignum Vitae." />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Portal privado: no debe aparecer en buscadores. A proposito no se bloquea
         en robots.txt, porque Google no podria leer el noindex. -->
    <title>Lignum Vitae — Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Plus Jakarta Sans es la tipografia de trabajo del portal (interfaz +
      datos): x-height grande, se lee bien a tamanos chicos, y es la
      recomendacion directa de ui-ux-pro-max para admin dashboards.
      Fraunces + Parisienne se quedan SOLO para el momento de marca del
      login (no se usan dentro del portal): ahi si vale un toque editorial,
      en una tabla de compras no.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&family=Parisienne&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
